; Konfigurasi PHP untuk Lab Pengujian (di-mount ke semua container)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Batas memori per request di Zend Memory Manager (dibuat kecil, mis. 2M atau 4M,
; agar kondisi OOM internal PHP mudah diamati tanpa memicu OOM Killer kernel Linux)
memory_limit = 2M

; Pengaturan upload & session
file_uploads = On
upload_max_filesize = 4M
post_max_size = 4M
session.save_path = "/tmp/php_sessions"
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
