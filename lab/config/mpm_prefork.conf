# Membatasi jumlah worker Apache prefork menjadi tepat 1 worker:
# 1. Menghemat RAM container seminimal mungkin
# 2. Memastikan setiap request berurutan ditangani oleh PID worker yang sama
<IfModule mpm_prefork_module>
    StartServers             1
    MinSpareServers          1
    MaxSpareServers          1
    MaxRequestWorkers        1
    MaxConnectionsPerChild   0
</IfModule>
